# /etc/nginx/snippets/php-blog.conf
#
# /PHP/ 博客的 nginx 配置片段，被 include 进 server 块。
# 由 blog-deploy/enable-php-blog.sh 安装。
#
# 位置顺序很重要：正则 location 是按出现顺序匹配的，
# 所以「拒绝敏感路径」必须写在「PHP 交给 php-fpm」前面。

# 上传图片上限 10MB，留点余量
client_max_body_size 12m;

# /PHP 统一跳到 /PHP/
location = /PHP { return 301 /PHP/; }

# 静态资源（css / js / KaTeX 字体）由 nginx 直接送出
location /PHP/assets/ {
    root /home/guosh/WEB_ROOT;
    access_log off;
    expires 7d;
}

# 博客入口。try_files 的最后一个参数会把找不到的路径交给 index.php
location /PHP/ {
    root /home/guosh/WEB_ROOT;
    index index.php;
    try_files $uri $uri/ /PHP/index.php?$query_string;
}

# ① 源码、模板、数据、依赖、文档目录一律不允许下载
location ~ ^/PHP/(data|lib|templates|vendor|bin|docs)(/|$) { deny all; }

# ② 数据库与说明文件也不允许下载
location ~ ^/PHP/.*\.(sqlite[0-9-]*|sqlite-wal|sqlite-shm|md|json|qd|txt|ini|log|bak|lock)$ { deny all; }

# ③ 隐藏文件（含 .git 仓库、.gitignore），放行 ACME 校验目录
location ~ /\.(?!well-known) { deny all; }

# ④ 只允许 /PHP/ 顶层的 PHP 入口被执行
location ~ ^/PHP/[^/]+\.php$ {
    root /home/guosh/WEB_ROOT;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_read_timeout 60s;
}
